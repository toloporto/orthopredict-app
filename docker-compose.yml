# orthopredict_app/docker-compose.yml
version: '3.8'

services:
  orthopredict-app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - ORTHOPREDICT_DEBUG=false
      - ORTHOPREDICT_CACHE_ENABLED=true
      - ORTHOPREDICT_ML_TRAINING_SAMPLES=2000
    volumes:
      - orthopredict_data:/app/data
      - orthopredict_models:/app/models
      - orthopredict_logs:/app/logs
      - orthopredict_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  orthopredict_data:
  orthopredict_models:
  orthopredict_logs:
  orthopredict_backups:
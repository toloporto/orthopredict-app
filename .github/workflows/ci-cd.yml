# orthopredict_app/.github/workflows/ci-cd.yml
name: OrthoPredict CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Variables de entorno para notificaciones
env: # Cambiado a Discord
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  # JOB 1: Ejecutar Tests
  run-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    
    steps:
    # Paso 1: Obtener el código
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    # Paso 2: Configurar Python
    - name: 🐍 Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    # Paso 3: Instalar dependencias
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov bandit
    
    # Paso 4: Ejecutar tests con cobertura
    - name: 🧪 Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    # Paso 5: Subir reporte de cobertura (Opcional)
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # JOB 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: run-tests  # Espera a que los tests pasen
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 🔒 Install bandit
      run: pip install bandit
    
    - name: 🔍 Run security scan
      run: |
        bandit -r src/ -f html -o security-report.html || true
    
    - name: 💾 Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.html

  # JOB 3: Build Docker Image (Solo en main)
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [run-tests, security-scan]  # Espera a tests y security
    if: github.ref == 'refs/heads/main'  # Solo en branch main
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 📦 Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false  # No pushear a registry por ahora
        tags: orthopredict-pro:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 🐳 Test Docker image
      run: |
        # Construir imagen
        docker build -t orthopredict-pro-test .
        
        # Ejecutar contenedor de prueba
        docker run -d --name orthopredict-test -p 8501:8501 orthopredict-pro-test
        
        # Esperar que la app inicie
        sleep 15
        
        # Verificar que el contenedor está corriendo
        docker ps | grep orthopredict-test
        
        # Verificar logs
        docker logs orthopredict-test > docker-test.log 2>&1
        
        # Limpiar
        docker stop orthopredict-test
        docker rm orthopredict-test
    
    - name: 💾 Upload Docker logs
      if: always()  # Subir logs incluso si falla
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: docker-test.log
        retention-days: 7

  # JOB 4: Deploy (Opcional - para cuando tengas servidor)
  # deploy:
  #   name: Deploy to Server
  #   runs-on: ubuntu-latest
  #   needs: docker-build
  #   if: github.ref == 'refs/heads/main'
  #   
  #   steps:
  #   - name: 🚀 Deploy to production
  #     run: echo "Deploy logic would go here"

  # JOB 5: Notificaciones
  notifications:
    name: Send Notifications
    runs-on: ubuntu-latest
    # Se ejecuta después de los jobs principales, sin importar si fallan
    needs: [run-tests, security-scan, docker-build]
    if: always() # 'always()' asegura que este job se ejecute siempre
    
    steps:
    - name: 📢 Send Discord notification
      uses: tsickert/discord-webhook@v5
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        content: |
          **OrthoPredict CI/CD Pipeline Status: `${{ job.status }}`**
          - **Repositorio:** `${{ github.repository }}`
          - **Commit:** `${{ github.sha }}`
          - **Autor:** `${{ github.actor }}`
          - **Workflow:** `${{ github.workflow }}`
          - Ver detalles de la ejecución

  # JOB 6: Despliegue a Producción (Solo en main)
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          toloporto/orthopredict-pro:latest
          toloporto/orthopredict-pro:${{ github.sha }}
    
    - name: 🚀 Deploy to server
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull toloporto/orthopredict-pro:latest
          docker stop orthopredict-app || true
          docker rm orthopredict-app || true
          docker run -d \
            --name orthopredict-app \
            -p 8501:8501 \
            --restart unless-stopped \
            toloporto/orthopredict-pro:latest

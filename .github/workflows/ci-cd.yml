# orthopredict_app/.github/workflows/ci-cd.yml
name: OrthoPredict CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Ejecutar Tests
  run-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    
    steps:
    # Paso 1: Obtener el código
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    # Paso 2: Configurar Python
    - name: 🐍 Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    # Paso 3: Instalar dependencias
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov bandit
    
    # Paso 4: Ejecutar tests con cobertura
    - name: 🧪 Run tests with coverage
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    # Paso 5: Subir reporte de cobertura (Opcional)
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # JOB 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: run-tests  # Espera a que los tests pasen
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 🔒 Install bandit
      run: pip install bandit
    
    - name: 🔍 Run security scan
      run: |
        bandit -r src/ -f html -o security-report.html || true
    
    - name: 💾 Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.html

  # JOB 3: Build Docker Image (Solo en main)
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [run-tests, security-scan]  # Espera a tests y security
    if: github.ref == 'refs/heads/main'  # Solo en branch main
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 📦 Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false  # No pushear a registry por ahora
        tags: orthopredict-pro:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 🐳 Test Docker image
      run: |
        # Construir imagen
        docker build -t orthopredict-pro-test .
        
        # Ejecutar contenedor de prueba
        docker run -d --name orthopredict-test -p 8501:8501 orthopredict-pro-test
        
        # Esperar que la app inicie
        sleep 15
        
        # Verificar que el contenedor está corriendo
        docker ps | grep orthopredict-test
        
        # Verificar logs        docker logs orthopredict-test > docker-test.log 2>&1
        
        # Limpiar
        docker stop orthopredict-test
        docker rm orthopredict-test
    
    - name: 💾 Upload Docker logs
      if: always()  # Subir logs incluso si falla
      uses: actions/upload-artifact@v3
      with:
        name: docker-logs
        path: docker-test.log
        retention-days: 7

